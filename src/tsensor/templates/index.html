<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSensor - Monitoramento em Tempo Real</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

    <!-- Setup Overlay (Exibido se a conexão falhar) -->
    <div id="setup-overlay" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-8 border border-slate-200 overflow-y-auto max-h-[90vh]">
            <div class="flex flex-col items-center text-center mb-6">
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mb-3">
                    <i class="bi bi-gear-fill text-2xl"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-800">Configurações do Sistema</h2>
                <p class="text-sm text-slate-500">Ajuste os parâmetros de hardware e visualização.</p>
            </div>

            <form id="setup-form" class="space-y-6">
                <!-- Seção: Hardware -->
                <div class="space-y-4">
                    <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider border-b pb-2">Hardware & Conexão</h3>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Porta Serial</label>
                        <div class="relative">
                            <i class="bi bi-usb-symbol absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
                            <input type="text" name="port" id="setup-port" value="{{ config.hardware.port }}"
                                   class="w-full pl-10 pr-4 py-3 text-base border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all shadow-sm">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Microcontrolador</label>
                            <select name="mcu" id="setup-mcu" 
                                    class="w-full px-4 py-3 text-base border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all shadow-sm">
                                <option value="arduino_uno" {% if config.hardware.mcu == 'arduino_uno' %}selected{% endif %}>Arduino Uno</option>
                                <option value="esp32" {% if config.hardware.mcu == 'esp32' %}selected{% endif %}>ESP32</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Baudrate</label>
                            <select name="baudrate" id="setup-baudrate"
                                    class="w-full px-4 py-3 text-base border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all shadow-sm">
                                <option value="9600" {% if config.hardware.baudrate == 9600 %}selected{% endif %}>9600</option>
                                <option value="115200" {% if config.hardware.baudrate == 115200 %}selected{% endif %}>115200</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">V_Ref (Volts)</label>
                            <input type="number" step="0.1" name="v_ref" id="setup-vref" value="{{ config.sensor.v_ref }}"
                                   class="w-full px-4 py-3 text-base border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all shadow-sm bg-slate-50">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">ADC Max (Bits)</label>
                            <input type="number" name="adc_max" id="setup-adcmax" value="{{ config.sensor.adc_max }}"
                                   class="w-full px-4 py-3 text-base border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all shadow-sm bg-slate-50">
                        </div>
                    </div>
                </div>

                <!-- Seção: Aquisição -->
                <div class="space-y-4">
                    <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider border-b pb-2">Aquisição de Dados</h3>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1.5">Amostras Totais (Buffer)</label>
                        <input type="number" name="total_samples" value="{{ config.acquisition.total_samples }}"
                               class="w-full px-4 py-3 text-base border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all shadow-sm">
                    </div>
                </div>

                <!-- Seção: Interface -->
                <div class="space-y-4">
                    <h3 class="text-sm font-bold text-slate-400 uppercase tracking-wider border-b pb-2">Interface & Dashboard</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Atualização (ms)</label>
                            <input type="number" name="update_interval_ms" value="{{ config.presentation.update_interval_ms }}"
                                   class="w-full px-4 py-3 text-base border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all shadow-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1.5">Casas Decimais</label>
                            <input type="number" name="decimal_places" value="{{ config.presentation.decimal_places }}" min="0" max="4"
                                   class="w-full px-4 py-3 text-base border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition-all shadow-sm">
                        </div>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" id="setup-submit"
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2 group">
                        <span>SALVAR E CONECTAR</span>
                        <i class="bi bi-check-circle group-hover:scale-110 transition-transform"></i>
                    </button>
                </div>
            </form>
            
            <p id="setup-error" class="mt-4 text-xs text-red-600 font-medium text-center hidden"></p>
        </div>
    </div>

    <nav class="bg-slate-800 text-white shadow-lg mb-8">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="bi bi-cpu text-blue-400 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-tight">TSENSOR <span class="text-blue-400 text-sm font-normal">v1.0</span></h1>
            </div>
            <div class="flex items-center gap-4 text-sm font-medium">
                <span class="flex items-center gap-1"><i class="bi bi-circle-fill text-green-500 text-[10px] animate-pulse"></i> LIVE</span>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 pb-12">
        <!-- Dashboard Header -->
        <header class="mb-8">
            <h2 class="text-3xl font-bold text-slate-800">Dashboard de Aquisição</h2>
            <p class="text-slate-500">Monitoramento contínuo via Serial (ESP32)</p>
        </header>

        <!-- Stats Container (Atualizado via cru.js) -->
        <div id="stats-container"
             c-container="/api/stats"
             c-target="#stats-container"
             class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 mb-8">
            <!-- Os cards serão injetados aqui pelo Flask via partial template -->
            <div class="animate-pulse bg-white p-6 rounded-xl h-24 shadow-sm border border-slate-100"></div>
            <div class="animate-pulse bg-white p-6 rounded-xl h-24 shadow-sm border border-slate-100"></div>
            <div class="animate-pulse bg-white p-6 rounded-xl h-24 shadow-sm border border-slate-100"></div>
            <div class="animate-pulse bg-white p-6 rounded-xl h-24 shadow-sm border border-slate-100"></div>
            <div class="animate-pulse bg-white p-6 rounded-xl h-24 shadow-sm border border-slate-100"></div>
        </div>

        <!-- Gráfico de Histograma -->
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 mb-8">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-slate-700 font-bold text-lg flex items-center gap-2">
                    <i class="bi bi-bar-chart-fill text-blue-500"></i> Distribuição das Leituras
                </h3>
                <span class="text-xs text-slate-400 uppercase tracking-widest font-semibold">Atualização Automática</span>
            </div>
            <div class="relative h-[400px] w-full"
                 id="histogram-trigger"
                 c-container="/api/histogram"
                 c-type="json"
                 c-callback="renderHistogram">
                <canvas id="histogramChart"></canvas>
            </div>
        </div>
    </main>

    <!-- cru.js para manipulação dinâmica -->
    <script src="{{ url_for('static', filename='js/cru.js') }}"></script>

    <script>
        let chartInstance = null;

        // Elementos do DOM
        const setupOverlay = document.getElementById('setup-overlay');
        const setupForm = document.getElementById('setup-form');
        const setupError = document.getElementById('setup-error');
        const setupSubmit = document.getElementById('setup-submit');

        // Verifica status da conexão ao carregar
        async function checkStatus() {
            try {
                const response = await fetch('/api/status');
                const status = await response.json();
                
                if (!status.connected) {
                    setupOverlay.classList.remove('hidden');
                    if (status.error) {
                        setupError.innerText = `Erro: ${status.error}`;
                        setupError.classList.remove('hidden');
                    }
                } else {
                    setupOverlay.classList.add('hidden');
                    startPolling();
                }
            } catch (err) {
                console.error("Falha ao obter status:", err);
            }
        }

        // Envia novas configurações
        setupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            setupSubmit.disabled = true;
            setupSubmit.innerHTML = '<i class="bi bi-arrow-repeat animate-spin"></i> CONECTANDO...';

            const formData = new FormData(setupForm);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('/api/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // Recarrega a página para aplicar as mudanças de hardware
                    window.location.reload();
                } else {
                    setupError.innerText = result.error || "Erro desconhecido ao salvar.";
                    setupError.classList.remove('hidden');
                    setupSubmit.disabled = false;
                    setupSubmit.innerHTML = '<span>CONECTAR SENSOR</span><i class="bi bi-arrow-right"></i>';
                }
            } catch (err) {
                setupError.innerText = "Erro de rede ao conectar.";
                setupError.classList.remove('hidden');
                setupSubmit.disabled = false;
                setupSubmit.innerHTML = '<span>CONECTAR SENSOR</span><i class="bi bi-arrow-right"></i>';
            }
        });

        $cruConfig({
            callbacks: {
                renderHistogram: (data, target) => {
                    const ctx = document.getElementById('histogramChart').getContext('2d');

                    if (chartInstance) {
                        // Atualiza apenas os dados e labels para manter a transição suave
                        chartInstance.data.labels = data.labels;
                        chartInstance.data.datasets[0].data = data.values;
                        chartInstance.update('none'); // 'none' desabilita animação de reconstrução, mantendo apenas o ajuste
                        return;
                    }

                    chartInstance = new Chart(ctx, {

                        type: 'bar',
                        data: {
                            labels: data.labels,
                            datasets: [{
                                label: 'Frequência',
                                data: data.values,
                                backgroundColor: 'rgba(59, 130, 246, 0.6)',
                                borderColor: 'rgb(59, 130, 246)',
                                borderWidth: 1,
                                borderRadius: 4,
                                barPercentage: 1.0,
                                categoryPercentage: 0.9
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                y: { beginAtZero: true, grid: { color: '#f1f5f9' } },
                                x: { grid: { display: false } }
                            }
                        }
                    });
                }
            }
        });

        // Polling dinâmico vindo do config.toml
        function startPolling() {
            setInterval(() => {
                $cruLoadContainer(document.getElementById('stats-container'));
                $cruLoadContainer(document.getElementById('histogram-trigger'));
            }, {{ config.presentation.update_interval_ms }});
        }

        // Lógica de atualização automática dos campos técnicos baseada no MCU
        const mcuSelect = document.getElementById('setup-mcu');
        const vrefInput = document.getElementById('setup-vref');
        const adcMaxInput = document.getElementById('setup-adcmax');

        const presets = {
            'arduino_uno': { vref: 1.1, adc: 1023 },
            'esp32': { vref: 3.3, adc: 4095 }
        };

        mcuSelect.addEventListener('change', (e) => {
            const preset = presets[e.target.value];
            if (preset) {
                vrefInput.value = preset.vref;
                adcMaxInput.value = preset.adc;
                
                // Feedback visual de atualização
                [vrefInput, adcMaxInput].forEach(el => {
                    el.classList.add('ring-2', 'ring-blue-400');
                    setTimeout(() => el.classList.remove('ring-2', 'ring-blue-400'), 1000);
                });
            }
        });

        // Inicialização
        checkStatus();
    </script>
</body>
</html>
