[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tsensor"
version = "0.1.0"
dependencies = [
    "flask",
    "pyserial",
    "loguru",
    "toml",
    "google-api-python-client",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "parsel",
    "pytest",
    "pytest-mock",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
